<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片压缩 - 100% 本地处理</title>
<meta name="description" content="免费开源的图片压缩工具，所有处理均在浏览器本地完成，图片不会上传到任何服务器。">
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1a1a1a; --muted: #666; --border: #e5e7eb; --accent: #2563eb; --accent-hover: #1d4ed8; --green: #15803d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { text-align: center; padding: 40px 16px 8px; }
  header h1 { margin: 0; font-size: 30px; }
  header p { color: var(--muted); margin: 10px 0 0; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  #dropzone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; }
  #dropzone.dragover { border-color: var(--accent); background: #eff6ff; }
  #dropzone p { margin: 6px 0; color: var(--muted); }
  #dropzone strong { font-size: 18px; color: var(--text); }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .field label { display: block; font-size: 14px; margin-bottom: 6px; color: var(--muted); }
  .field select, .field input[type="number"] { width: 100%; padding: 8px 10px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; }
  .field input[type="range"] { width: 100%; }
  .field .value { font-size: 14px; color: var(--text); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button { padding: 10px 18px; font-size: 15px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #summary { font-size: 15px; }
  #summary b { color: var(--green); }
  .item { display: flex; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; background: #f1f5f9; flex-shrink: 0; }
  .item .meta { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sizes { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .item .sizes b { color: var(--green); }
  .item .error { color: #dc2626; font-size: 14px; margin-top: 4px; }
  .item .dl { flex-shrink: 0; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding-bottom: 32px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>图片压缩</h1>
  <p>100% 本地处理 · 图片不会上传到任何服务器 · 支持批量</p>
</header>
<main>
  <div class="card">
    <div id="dropzone" tabindex="0" role="button" aria-label="选择图片">
      <strong>拖拽图片到这里，或点击选择</strong>
      <p>支持 JPG、PNG、WebP、GIF（首帧）、BMP、SVG 等常见格式，也可直接 Ctrl+V 粘贴</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
  </div>

  <div class="card">
    <div class="settings">
      <div class="field">
        <label for="format">输出格式</label>
        <select id="format">
          <option value="original">保持原格式</option>
          <option value="image/jpeg">JPEG（体积最小，适合照片）</option>
          <option value="image/png">PNG（无损，适合截图/线条图）</option>
          <option value="image/webp" selected>WebP（体积小且保真，推荐）</option>
        </select>
      </div>
      <div class="field">
        <label for="quality">质量 <span class="value" id="qualityValue">80%</span></label>
        <input type="range" id="quality" min="10" max="100" value="80">
      </div>
      <div class="field">
        <label for="maxSize">最长边（像素，0 = 不缩放）</label>
        <input type="number" id="maxSize" min="0" max="20000" value="1920">
      </div>
      <div class="field">
        <label><input type="checkbox" id="noUpscale" checked> 不放大图片（只缩小）</label>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="downloadAll" disabled>全部下载</button>
      <button id="clearAll" disabled>清空列表</button>
    </div>
  </div>

  <div class="card" id="resultCard" hidden>
    <div id="summary"></div>
    <div id="list"></div>
  </div>
</main>
<footer>
  开源项目 · 所有压缩均在你的浏览器内完成，不经过任何服务器<br>
  注意：GIF 动图压缩后只保留首帧；JPEG 不支持透明通道，透明部分会填充白色。
</footer>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const formatSel = document.getElementById('format');
const qualityInput = document.getElementById('quality');
const qualityValue = document.getElementById('qualityValue');
const maxSizeInput = document.getElementById('maxSize');
const noUpscaleInput = document.getElementById('noUpscale');
const downloadAllBtn = document.getElementById('downloadAll');
const clearAllBtn = document.getElementById('clearAll');
const resultCard = document.getElementById('resultCard');
const summaryEl = document.getElementById('summary');
const listEl = document.getElementById('list');

let items = []; // { id, file, url, outUrl, outName, outSize, error, done }

const fmtSize = (n) => {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
};
const extOf = (type) => ({ 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[type] || 'png');
const baseName = (name) => name.replace(/\.[^.]+$/, '');

function syncQualityState() {
  const f = formatSel.value;
  // PNG 为无损格式，质量滑杆不起作用
  qualityInput.disabled = (f === 'image/png');
  qualityValue.textContent = qualityInput.value + '%';
}
qualityInput.addEventListener('input', () => { syncQualityState(); recompressAll(); });
formatSel.addEventListener('change', () => { syncQualityState(); recompressAll(); });
maxSizeInput.addEventListener('change', recompressAll);
noUpscaleInput.addEventListener('change', recompressAll);
syncQualityState();

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });
['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
dropzone.addEventListener('drop', (e) => addFiles([...e.dataTransfer.files].filter(f => f.type.startsWith('image/'))));
document.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) addFiles(files);
});

function addFiles(files) {
  for (const file of files) {
    const id = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    items.push({ id, file, url: URL.createObjectURL(file), outUrl: null, outName: null, outSize: 0, error: null, done: false });
  }
  render();
  compressAll();
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('无法解码该图片')); };
    img.src = url;
  });
}

async function compressItem(item) {
  try {
    const img = await loadImage(item.file);
    let { width, height } = img;
    const max = parseInt(maxSizeInput.value, 10) || 0;
    if (max > 0 && Math.max(width, height) > max) {
      const scale = max / Math.max(width, height);
      width = Math.round(width * scale);
      height = Math.round(height * scale);
    } else if (noUpscaleInput.checked && max > 0 && Math.max(width, height) < max) {
      // 不放大：保持原尺寸
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    let outType = formatSel.value === 'original' ? item.file.type : formatSel.value;
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(outType)) outType = 'image/png';
    if (outType === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height); }
    ctx.drawImage(img, 0, 0, width, height);
    const quality = qualityInput.value / 100;
    const blob = await new Promise((res) => canvas.toBlob(res, outType, outType === 'image/png' ? undefined : quality));
    if (!blob) throw new Error('浏览器不支持输出该格式');
    if (item.outUrl) URL.revokeObjectURL(item.outUrl);
    item.outUrl = URL.createObjectURL(blob);
    item.outSize = blob.size;
    item.outName = baseName(item.file.name) + '-compressed.' + extOf(outType);
    item.done = true;
    item.error = null;
  } catch (err) {
    item.error = err.message || '压缩失败';
    item.done = false;
  }
}

async function compressAll() {
  await Promise.all(items.map(compressItem));
  render();
}
async function recompressAll() {
  if (!items.length) return;
  items.forEach(i => { i.done = false; i.error = null; });
  render();
  await compressAll();
}

function render() {
  const done = items.filter(i => i.done);
  resultCard.hidden = items.length === 0;
  downloadAllBtn.disabled = done.length === 0;
  clearAllBtn.disabled = items.length === 0;
  if (items.length) {
    const orig = items.reduce((s, i) => s + i.file.size, 0);
    const comp = done.reduce((s, i) => s + i.outSize, 0);
    const saved = orig > 0 ? Math.max(0, Math.round((1 - comp / orig) * 100)) : 0;
    summaryEl.innerHTML = `共 ${items.length} 张，已完成 ${done.length} 张 · 原始 ${fmtSize(orig)} → 压缩后 ${fmtSize(comp)} · <b>节省 ${saved}%</b>`;
  }
  listEl.innerHTML = '';
  for (const item of items) {
    const row = document.createElement('div');
    row.className = 'item';
    const thumb = document.createElement('img');
    thumb.src = item.done ? item.outUrl : item.url;
    thumb.alt = item.file.name;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = item.file.name;
    meta.appendChild(name);
    const sizes = document.createElement('div');
    sizes.className = 'sizes';
    if (item.error) {
      sizes.innerHTML = `<span class="error">${item.error}</span>`;
    } else if (item.done) {
      const saved = item.file.size > 0 ? Math.max(0, Math.round((1 - item.outSize / item.file.size) * 100)) : 0;
      sizes.innerHTML = `${fmtSize(item.file.size)} → ${fmtSize(item.outSize)} · <b>节省 ${saved}%</b>`;
    } else {
      sizes.textContent = fmtSize(item.file.size) + ' · 处理中…';
    }
    meta.appendChild(sizes);
    row.appendChild(thumb);
    row.appendChild(meta);
    if (item.done) {
      const a = document.createElement('a');
      a.href = item.outUrl;
      a.download = item.outName;
      const btn = document.createElement('button');
      btn.className = 'dl';
      btn.textContent = '下载';
      a.appendChild(btn);
      row.appendChild(a);
    }
    const rm = document.createElement('button');
    rm.textContent = '移除';
    rm.addEventListener('click', () => {
      items = items.filter(i => i.id !== item.id);
      URL.revokeObjectURL(item.url);
      if (item.outUrl) URL.revokeObjectURL(item.outUrl);
      render();
    });
    row.appendChild(rm);
    listEl.appendChild(row);
  }
}

downloadAllBtn.addEventListener('click', () => {
  // 逐个触发下载（浏览器可能询问是否允许多个文件下载，点允许即可）
  items.filter(i => i.done).forEach((item, idx) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = item.outUrl;
      a.download = item.outName;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, idx * 300);
  });
});
clearAllBtn.addEventListener('click', () => {
  items.forEach(i => { URL.revokeObjectURL(i.url); if (i.outUrl) URL.revokeObjectURL(i.outUrl); });
  items = [];
  render();
});
</script>
</body>
</html>
