name: CI

# Type check, unit tests and a build on every push and PR. The last step
# fails when the committed docs/ differs from what src/ builds to, which
# catches a push that carried the build output without its source (or
# the other way round).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Independent decoders the format tests compare against (they are
      # skipped without them): Pillow, tifffile, imagecodecs (JPEG XL).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install numpy Pillow tifffile imagecodecs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: docs/ matches the source
        run: |
          git add -N docs
          git diff --stat --exit-code -- docs || {
            echo "::error::docs/ is out of date with src/. Run pnpm build and commit docs/ together with src/."
            exit 1
          }
